spring.application.name=ai-resume-job-matcher
server.port=8080
server.error.include-message=always

# MySQL (override with environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_matcher?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# PDF upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Gemini (never commit your real key - set GEMINI_API_KEY as an env variable)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
